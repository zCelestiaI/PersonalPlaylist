<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Playlist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="card">
        <div class="profile-img">
            <img src="images/wallpaper.jpg" alt="Avatar">
        </div>

        <h1 class="name">Tamono Damiante</h1>
        <p class="bio">One sided love • Double bladed dagger</p>

        <div class="status-badge">
            <span class="dot"></span> IDLE
        </div>

        <p class="greeting"><i>Personal Favourites</i></p>

        <div class="slider-container">
            <div class="volume-header">
                <span>Volume</span>
                <span id="volume-value">30%</span>
            </div>
            <input type="range" min="0" max="100" value="30" class="main-slider" id="volume-slider">
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/phuthai.nguyen.395?locale=vi_VN" class="btn">Facebook</a>
            <a href="https://discord.gg/XyGKyvRMp" class="btn">Discord Server</a>
        </div>

        <div class="music-player">
            <div class="player-main-layout">
                <img src="" alt="Song Cover" class="song-img">
                <div class="song-info">
                    <p class="song-title">Đang tải...</p>
                    <p class="song-artist">Ca sĩ</p>
                    <div class="progress-bar">
                        <span id="current-time">0:00</span>
                        <input type="range" min="0" max="100" value="0" class="seek-slider" id="seek-slider">
                        <span id="duration-time">0:00</span>
                    </div>
                </div>
                <div class="controls">
                    <i class="fas fa-step-backward"></i>
                    <i class="fas fa-play"></i>
                    <i class="fas fa-step-forward"></i>
                    <i class="fas fa-redo"></i>
                </div>
            </div>

            <button id="playlist-toggle-btn" class="playlist-btn">
                <i class="fas fa-list"></i> Danh sách bài hát
            </button>

            <div id="playlist-dropdown" class="playlist-dropdown">
                <ul id="song-list">
                    <li data-index="0" class="song-item active">Sớm như vậy - Bùi Trường Linh</li>
                    <li data-index="1" class="song-item">Too little Too late - Laufey</li>
                    <li data-index="2" class="song-item">Những lời hứa bỏ quên - VŨ</li>
                    <li data-index="3" class="song-item">Tháng Năm - SOOBIN</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<audio id="main-audio" src=""></audio>
<script src="script.js"></script>
</body>
</html>
